# Publishes to PyPI when pyproject.toml version is new.
#
# Secret (mailofly-python repo): PYPI_TOKEN
#   Create at https://pypi.org/manage/account/token/

name: Publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          NAME="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          if curl -fsSL "https://pypi.org/pypi/${NAME}/json" -o /tmp/pkg.json; then
            if python -c "import json,sys; v=json.load(open('/tmp/pkg.json'))['releases']; sys.exit(0 if '$VERSION' in v else 1)"; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Version $VERSION already on PyPI — skipping."
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Package not on PyPI yet — will publish $VERSION."
          fi

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: python -m build

      - name: Publish
        if: steps.version.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "::error::PYPI_TOKEN secret is not set."
            exit 1
          fi
          twine upload dist/*
