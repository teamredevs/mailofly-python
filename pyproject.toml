[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailofly"
version = "0.1.0"
description = "Official Python client for the Mailofly REST API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mailofly" }]
keywords = ["mailofly", "email", "api", "sdk", "client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://docs.mailofly.com/sdks/python"
Documentation = "https://docs.mailofly.com/sdks/python"
Repository = "https://github.com/teamredevs/mailofly-python"
Issues = "https://github.com/teamredevs/mailofly-python/issues"
Changelog = "https://github.com/teamredevs/mailofly-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/mailofly"]

[tool.hatch.build.targets.wheel.sources]
"src/mailofly" = "mailofly"

[tool.hatch.build.targets.sdist]
include = ["src/mailofly", "README.md", "LICENSE", "CHANGELOG.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
